# Passport for numeric claim provenance.
# One entry per numeric claim in the manuscript.
# Audited by /review-numbers; never re-runs scripts.
#
# Status values: PASS | FAIL | STALE | UNVERIFIED | EXPLAINED
#
# Scale notes for the auditor:
#   - MFX (marginal effects) are stored on the 0-1 probability scale in the
#     estimates/mfx_period CSVs; the paper states them in percentage points
#     (0.4462 in the artifact = "roughly 45 percentage points" in prose).
#   - Reallocation values in quality_realloc_all.tex are already scaled to the
#     paper's units ($ millions; admissions per 10,000 / 2,000 referrals).
#   - persist.tex is generated by code/analysis/5_persistence.R (promoted 2026-08-10); staleness
#     cannot be checked for those claims.

passport_version: 1
paper: physician-referral-formation

claims:

